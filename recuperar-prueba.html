<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mate Topp® | Recuperar acceso de prueba</title><style>body{margin:0;background:#f5efe5;font-family:Arial,sans-serif;color:#173a2b}.wrap{max-width:560px;margin:0 auto;padding:60px 20px}.card{background:#fff;border-radius:24px;padding:26px;border:1px solid #ded6c8;box-shadow:0 20px 50px rgba(23,58,43,.08)}h1{margin:0 0 10px;font-family:Georgia,serif;font-weight:400;font-size:38px}p{line-height:1.5;color:#59615c}.field{margin-top:18px}.field label{display:block;font-weight:700;margin-bottom:8px}.field input{width:100%;box-sizing:border-box;border:1px solid #7e9a88;border-radius:14px;padding:14px 16px;font-size:16px}.btn{width:100%;border:0;border-radius:999px;background:#173a2b;color:#fff;padding:15px 18px;font-weight:700;font-size:16px;margin-top:22px;cursor:pointer}.msg{margin-top:12px;font-size:13px;color:#707873}.error{color:#8a3a32}</style></head><body><main class="wrap"><section class="card"><h1>Recuperar acceso</h1><p>Esta pantalla es solo para la versión de prueba. Ingresá el mismo WhatsApp con el que creaste tu cuenta y elegí una contraseña nueva.</p><form id="form"><div class="field"><label for="phone">WhatsApp</label><input id="phone" inputmode="numeric" value="549" required></div><div class="field"><label for="password">Nueva contraseña</label><input id="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div><button class="btn" type="submit">Cambiar contraseña y entrar</button><div id="msg" class="msg"></div></form></section></main><script>const qs=new URLSearchParams(location.search),token=qs.get('token')||'',msg=document.getElementById('msg');document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';msg.textContent='Actualizando...';try{const r=await fetch('/preview-reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,phone:document.getElementById('phone').value,password:document.getElementById('password').value})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo recuperar');msg.textContent='Listo. Entrando al Portal...';setTimeout(()=>location.href='/portal',500)}catch(err){msg.className='msg error';msg.textContent=err.message}}</script></body></html>
