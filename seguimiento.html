<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mate Topp® | Seguimiento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--g:#173a2b;--c:#f5efe5;--gold:#c7a86f;--ink:#34433b;--muted:#707873;--line:#ded6c8}*{box-sizing:border-box}body{margin:0;font-family:Poppins,Arial,sans-serif;background:var(--c);color:var(--ink)}header{height:92px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6vw}.logo{width:145px}.wrap{max-width:820px;margin:0 auto;padding:64px 22px}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-weight:700}.title{font-family:'Libre Baskerville',serif;color:var(--g);font-size:clamp(36px,6vw,56px);font-weight:400;margin:10px 0 24px}.status{display:inline-flex;border-radius:999px;background:var(--g);color:#fff;padding:9px 14px;font-weight:700;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.item{background:#faf8f3;border-radius:16px;padding:16px}.item small{display:block;color:var(--muted);margin-bottom:6px}.item strong{color:var(--g)}.btn{display:block;text-align:center;margin-top:22px;background:var(--g);color:#fff;text-decoration:none;border-radius:999px;padding:15px;font-weight:700}.empty{color:var(--muted);line-height:1.6}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:24px}}</style></head><body><header><a href="/"><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"></a></header><main class="wrap"><section class="card"><div class="eyebrow">Seguimiento Mate Topp®</div><h1 class="title">Estado de tu pedido</h1><div id="content" class="empty">Cargando seguimiento...</div></section></main><script>const q=new URLSearchParams(location.search),orderId=q.get('pedido')||'',sig=q.get('firma')||'',box=document.getElementById('content');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));(async()=>{try{const r=await fetch('/workflow-api?'+new URLSearchParams({action:'trackingPublic',orderId,sig}),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');const t=j.tracking||{};box.className='';box.innerHTML=`<span class="status">${esc(t.finalizedAt?'PEDIDO FINALIZADO':t.dispatchedAt?'PEDIDO DESPACHADO':t.status||'EN PREPARACIÓN')}</span><div class="grid"><div class="item"><small>Pedido</small><strong>${esc(t.id||orderId)}</strong></div><div class="item"><small>Transportista</small><strong>${esc(t.carrier||'Pendiente')}</strong></div><div class="item"><small>Código de seguimiento</small><strong>${esc(t.trackingCode||'Pendiente')}</strong></div><div class="item"><small>Despacho</small><strong>${t.dispatchedAt?new Date(t.dispatchedAt).toLocaleString('es-AR'):'Pendiente'}</strong></div></div>${t.trackingLink?`<a class="btn" href="${esc(t.trackingLink)}" target="_blank" rel="noopener">Abrir seguimiento del transportista</a>`:''}`;}catch(e){box.textContent=e.message||'El enlace de seguimiento no es válido.'}})();</script></body></html>
