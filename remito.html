<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate Topp® | Remito</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#173a2b;--cream:#F5EFE5;--gold:#c7a86f;--ink:#2f3e36;--muted:#6f7772;--line:#d9d2c5}*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:var(--ink);font-family:Poppins,Arial,sans-serif}.page{width:min(210mm,calc(100% - 24px));min-height:297mm;margin:18px auto;background:#fff;padding:18mm;box-shadow:0 8px 30px rgba(0,0,0,.08)}header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--green);padding-bottom:18px}.logo{width:150px}.doc{text-align:right}.doc strong{font-size:24px;color:var(--green)}.doc small{display:block;color:var(--muted);margin-top:5px}.section{margin-top:24px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}.box{background:var(--cream);border-radius:12px;padding:14px}.box small{display:block;color:var(--muted);margin-bottom:5px}.items{width:100%;border-collapse:collapse;margin-top:12px}.items th,.items td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.items th:last-child,.items td:last-child{text-align:right}.totals{margin-left:auto;width:min(360px,100%);margin-top:18px}.row{display:flex;justify-content:space-between;padding:7px 0}.row.final{font-size:20px;font-weight:700;color:var(--green);border-top:2px solid var(--green);margin-top:5px;padding-top:12px}.footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.actions{width:min(210mm,calc(100% - 24px));margin:16px auto;display:flex;justify-content:flex-end}.print{border:0;background:var(--green);color:#fff;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700}.loading,.error{padding:40px;text-align:center}.error{color:#842d23}@media(max-width:650px){.page{padding:20px;min-height:auto}.grid{grid-template-columns:1fr}.doc strong{font-size:18px}.logo{width:125px}}@media print{body{background:#fff}.actions{display:none}.page{width:100%;min-height:auto;margin:0;box-shadow:none;padding:14mm}}
</style>
</head>
<body><div class="actions"><button class="print" onclick="window.print()">Imprimir / Guardar PDF</button></div><main class="page" id="page"><div class="loading">Cargando remito...</div></main>
<script>
const p=new URLSearchParams(location.search),orderId=p.get('pedido')||'',sig=p.get('firma')||'';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseNotes(notes){if(!notes)return{};try{return JSON.parse(notes)}catch{}const m=String(notes).match(/Email:\s*([^\s]+)/i);return{email:m?m[1]:''}}
async function load(){if(!orderId||!sig){document.getElementById('page').innerHTML='<div class="error">El enlace del remito no es válido.</div>';return}try{const r=await fetch('/quote-api?'+new URLSearchParams({action:'remito',orderId,sig}));const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');render(j.order)}catch(e){document.getElementById('page').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(o){const info=parseNotes(o.notes),items=(o.items||[]).map(i=>`<tr><td>${esc(i.qty)}</td><td>${esc(i.desc)}</td><td>${money(i.price)}</td><td>${money((Number(i.qty)||0)*(Number(i.price)||0))}</td></tr>`).join('');const date=o.paymentConfirmedAt?new Date(o.paymentConfirmedAt).toLocaleString('es-AR'):'—';document.getElementById('page').innerHTML=`<header><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"><div class="doc"><strong>REMITO</strong><small>${esc(o.remitoNumber||o.id)}</small><small>${esc(date)}</small></div></header><section class="section"><div class="label">Cliente</div><div class="grid"><div class="box"><small>Nombre</small><strong>${esc(o.customer)}</strong></div><div class="box"><small>WhatsApp</small><strong>${esc(o.customerPhone)}</strong></div><div class="box"><small>Email</small><strong>${esc(info.email||'')}</strong></div><div class="box"><small>Dirección de entrega</small><strong>${esc(o.address)}</strong></div></div></section><section class="section"><div class="label">Detalle</div><table class="items"><thead><tr><th>Cant.</th><th>Producto</th><th>Unitario</th><th>Subtotal</th></tr></thead><tbody>${items}</tbody></table><div class="totals"><div class="row"><span>Productos</span><strong>${money(o.subtotal)}</strong></div><div class="row"><span>Envío</span><strong>${money(o.shipping)}</strong></div><div class="row final"><span>Total</span><span>${money(o.total)}</span></div></div></section><section class="section"><div class="grid"><div class="box"><small>Forma de pago</small><strong>${esc(o.paymentMethod||'')}</strong></div><div class="box"><small>Pedido</small><strong>${esc(o.id)}</strong></div></div></section><div class="footer">Mate Topp® · Documento generado al confirmar el pago. Este remito acompaña la gestión del pedido y la entrega.</div>`}
load();
</script></body></html>
