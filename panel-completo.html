<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mate Topp® | Mi panel</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}iframe{width:100%;height:100%;border:0;display:block}.fab{position:fixed;right:18px;bottom:18px;z-index:20;border:0;border-radius:999px;padding:12px 17px;background:#173a2b;color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer}.overlay{position:fixed;inset:0;z-index:30;background:rgba(18,32,25,.55);display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.panel{width:min(760px,100%);max-height:88vh;overflow:auto;background:#f7f4ee;border-radius:24px;padding:22px;color:#34433b}.top{display:flex;justify-content:space-between;align-items:center}.top h2{margin:0;color:#173a2b}.close{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:24px}.list{display:grid;gap:12px;margin-top:18px}.card{background:#fff;border:1px solid #ded6c8;border-radius:18px;padding:16px}.card h3{margin:0 0 6px;color:#173a2b}.meta{font-size:12px;color:#707873;line-height:1.6}.badge{display:inline-flex;margin-top:8px;border-radius:999px;padding:7px 10px;background:#f3ede2;color:#173a2b;font-size:11px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}.primary{background:#173a2b;color:#fff}.secondary{background:#f3ede2;color:#173a2b}.empty{color:#707873}.fab[hidden]{display:none}@media(max-width:600px){.fab{right:12px;bottom:12px}.panel{padding:16px}}</style></head><body><iframe id="base" src="/panel-maestro.html" title="Panel Mate Topp®"></iframe><button class="fab" id="open" hidden>Seguimiento</button><div class="overlay" id="overlay"><section class="panel"><div class="top"><h2>Despachos y seguimiento</h2><button class="close" id="close">×</button></div><div id="list" class="list"><div class="empty">Cargando...</div></div></section></div><script>const open=document.getElementById('open'),overlay=document.getElementById('overlay'),list=document.getElementById('list');let profile={};try{profile=JSON.parse(localStorage.getItem('mateToppAccess')||'{}')||{}}catch{}if(profile.sellerId||profile.phone)open.hidden=false;document.getElementById('base').addEventListener('load',()=>{try{profile=JSON.parse(localStorage.getItem('mateToppAccess')||'{}')||profile;if(profile.sellerId||profile.phone)open.hidden=false}catch{}});open.onclick=()=>{overlay.classList.add('open');load()};document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const phone=v=>String(v||'').replace(/\D/g,'');async function load(){try{profile=JSON.parse(localStorage.getItem('mateToppAccess')||'{}')||profile;const q=new URLSearchParams({action:'sellerTracking',sellerId:profile.sellerId||'',phone:profile.phone||''}),r=await fetch('/workflow-api?'+q,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');const rows=(j.tracking||[]).filter(t=>t.paymentConfirmedAt||t.dispatchedAt||t.finalizedAt).reverse();if(!rows.length){list.innerHTML='<div class="empty">Todavía no hay pedidos pagos o despachados.</div>';return}list.innerHTML=rows.map(t=>{const state=t.finalizedAt?'PEDIDO FINALIZADO':t.dispatchedAt?'PEDIDO DESPACHADO':'ESPERANDO DESPACHO';const detail=t.dispatchedAt?`Transportista: ${esc(t.carrier||'—')}<br>Código: ${esc(t.trackingCode||'—')}<br>Despachado: ${new Date(t.dispatchedAt).toLocaleString('es-AR')}`:'Mate Topp® todavía no registró el despacho.';return `<article class="card"><h3>${esc(t.id)}</h3><div class="meta">${esc(t.customer||'Cliente')}<br>${detail}</div><span class="badge">${state}</span><div class="actions">${t.publicTrackingUrl?`<button class="btn secondary" onclick="window.open('${esc(t.publicTrackingUrl)}','_blank')">Abrir seguimiento</button><button class="btn primary" onclick="send('${esc(t.id)}')">Enviar al cliente</button>`:''}</div></article>`}).join('');window.__tracking=rows}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function send(id){const t=(window.__tracking||[]).find(x=>String(x.id)===String(id));if(!t||!t.publicTrackingUrl)return;const p=phone(t.customerPhone);if(!p){alert('El pedido no tiene WhatsApp del cliente.');return}const text=[`Mate Topp® · ${t.id}`,'*TU PEDIDO FUE DESPACHADO*','',`Transportista: ${t.carrier||'—'}`,`Código: ${t.trackingCode||'—'}`,'',`Seguimiento: ${t.publicTrackingUrl}`].join('\n');window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank')}</script></body></html>
