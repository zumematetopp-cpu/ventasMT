<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate Topp® | Mis pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#173a2b;--cream:#F5EFE5;--gold:#c7a86f;--ink:#34433b;--muted:#707873;--line:#ded6c8;--danger:#8a3a32;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Arial,sans-serif;background:#f7f4ee;color:var(--ink)}button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:0 24px}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{width:135px}.back{border:1px solid var(--line);background:var(--cream);color:var(--green);border-radius:12px;padding:10px 14px;font-weight:700}.hero{padding:44px 0 26px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:700;color:var(--gold)}h1,h2{font-family:"Libre Baskerville",serif;color:var(--green);font-weight:400}h1{font-size:44px;margin:8px 0 10px}.muted{color:var(--muted)}.access{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.link{font-size:13px;word-break:break-word}.gold,.primary,.secondary,.danger{border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.gold{border:0;background:var(--gold);color:var(--green)}.primary{border:0;background:var(--green);color:#fff}.secondary{border:1px solid var(--line);background:var(--cream);color:var(--green)}.danger{border:1px solid #dcc0bc;background:#fff7f5;color:var(--danger)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.orders{display:grid;gap:14px;padding-bottom:90px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.toprow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.customer{font-size:19px;font-weight:700;color:var(--green)}.orderid{font-size:12px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:700;background:#eee8de;color:var(--green);text-transform:uppercase;white-space:nowrap}.badge.action{background:#fff0c9;color:#6d4f00}.badge.done{background:#dceee2;color:#13542d}.badge.receipt{background:#e8ecf7;color:#304870}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:14px}.detail{font-size:13px;line-height:1.65;color:var(--muted)}.items{list-style:none;padding:0;margin:10px 0 0}.items li{padding:5px 0;border-bottom:1px solid #f0ebe3;font-size:13px}.totals{background:var(--cream);border-radius:14px;padding:13px}.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.row.final{font-size:17px;font-weight:700;color:var(--green);border-top:1px solid #d9cfbf;margin-top:6px;padding-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button,.actions label{cursor:pointer}.upload{display:inline-flex;align-items:center}.upload input{display:none}.note{font-size:12px;color:var(--muted);margin-top:9px}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--muted)}.blocked{max-width:680px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center}
@media(max-width:760px){.wrap{padding:0 18px}.grid{grid-template-columns:1fr}.toprow{flex-direction:column}h1{font-size:36px}.access{grid-template-columns:1fr}.actions button,.actions label{width:100%;text-align:center}.topin{min-height:74px}.logo{width:122px}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"><button class="back" onclick="location.href='/'">Volver a mi acceso</button></div></header>
<main id="app"><div class="wrap"><section class="hero"><div class="eyebrow">Tu espacio en Mate Topp®</div><h1 id="hello">Mis pedidos</h1><p class="muted">Desde acá acompañás cada pedido B2C hasta que Mate Topp® confirme el pago y genere el remito.</p><div class="access"><div><strong>Enlace para clientes</strong><div id="clientLink" class="link"></div></div><button id="copyLink" class="gold">Copiar enlace</button></div></section><div class="toolbar"><strong>Pedidos activos</strong><button id="refresh" class="secondary">Actualizar</button></div><div id="message" class="note"></div><div id="orders" class="orders"></div></div></main>
<script>
const ACCESS_STORAGE_KEY='mateToppAccess';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const normalizePhone=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d=d.slice(1);if(d.startsWith('15'))d=d.slice(2);if(d.startsWith('54')&&!d.startsWith('549'))d='549'+d.slice(2);if(!d.startsWith('549'))d='549'+d.replace(/^549/,'');return d.slice(0,15)};
let profile=null,currentOrders=[];
function readProfile(){try{return JSON.parse(localStorage.getItem(ACCESS_STORAGE_KEY)||'null')}catch{return null}}
function clientLink(){if(!profile)return'';const p=new URLSearchParams({asesora:profile.name||'',wa:profile.phone||'',canal:'b2c'});if(profile.sellerId)p.set('sid',profile.sellerId);return location.origin+'/comprar?'+p.toString()}
async function qget(params){const r=await fetch('/quote-api?'+new URLSearchParams(params),{cache:'no-store'});const j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
async function qpost(body){const r=await fetch('/quote-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw new Error(j.error||'Error');return j}
function state(o){if(o.paymentConfirmedAt)return{label:'REMITO GENERADO',cls:'done'};if(o.receiptUploadedAt)return{label:'COMPROBANTE CARGADO',cls:'receipt'};if(o.paymentSentAt)return{label:'ESPERANDO PAGO',cls:'action'};if(o.shippingQuotedAt)return{label:'ENVÍO COTIZADO',cls:'done'};if(o.shippingRequestedAt)return{label:'ENVÍO SOLICITADO',cls:'action'};return{label:String(o.status||'PEDIDO RECIBIDO').toUpperCase(),cls:''}}
function subtotal(o){return Number(o.subtotal)||((o.items||[]).reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0))}
async function loadOrders(){const box=document.getElementById('orders'),msg=document.getElementById('message');box.innerHTML='<div class="empty">Actualizando...</div>';msg.textContent='';try{const data=await qget({action:'sellerOrders',sellerId:profile.sellerId||'',phone:profile.phone||''});currentOrders=data.orders||[];msg.textContent=data.cancelledCount?`Pedidos cancelados guardados: ${data.cancelledCount}`:'';render()}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function render(){const box=document.getElementById('orders');if(!currentOrders.length){box.innerHTML='<div class="empty">Todavía no hay pedidos B2C activos para este acceso.</div>';return}box.innerHTML=currentOrders.slice().reverse().map(o=>{const st=state(o),sub=subtotal(o),ship=Number(o.shipping)||0,total=Number(o.total)||sub+ship,items=(o.items||[]).map(i=>`<li>${esc(i.qty)} × ${esc(i.desc)} — ${money((Number(i.qty)||0)*(Number(i.price)||0))}</li>`).join('');let actions='';if(!o.shippingRequestedAt&&!o.paymentConfirmedAt)actions+=`<button class="gold" onclick="requestShipping('${esc(o.id)}')">Solicitar cotización de envío</button>`;if(o.shippingQuotedAt&&!o.paymentSentAt&&!o.paymentConfirmedAt)actions+=`<button class="primary" onclick="sendFinal('${esc(o.id)}')">Enviar total al cliente</button>`;if(o.paymentSentAt&&!o.receiptUploadedAt&&!o.paymentConfirmedAt)actions+=`<label class="secondary upload">Cargar comprobante<input type="file" accept="image/*,application/pdf" onchange="uploadReceipt('${esc(o.id)}',this)"></label>`;if(o.receiptUploadedAt&&!o.paymentConfirmedAt)actions+=`<span class="note">Comprobante enviado a Mate Topp® para revisión.</span>`;if(o.remitoUrl)actions+=`<button class="primary" onclick="window.open('${esc(o.remitoUrl)}','_blank')">Abrir remito</button>`;return `<article class="card"><div class="toprow"><div><div class="customer">${esc(o.customer||'Cliente')}</div><div class="orderid">${esc(o.id)}</div></div><span class="badge ${st.cls}">${esc(st.label)}</span></div><div class="grid"><div class="detail"><div><strong>WhatsApp:</strong> ${esc(o.customerPhone||'')}</div><div><strong>Dirección:</strong> ${esc(o.address||'')}</div><ul class="items">${items}</ul></div><div class="totals"><div class="row"><span>Productos</span><strong>${money(sub)}</strong></div><div class="row"><span>Envío</span><strong>${o.shippingQuotedAt?money(ship):'A cotizar'}</strong></div><div class="row final"><span>Total</span><span>${o.shippingQuotedAt?money(total):money(sub)}</span></div></div></div><div class="actions">${actions}</div></article>`}).join('')}
async function requestShipping(orderId){try{await qpost({action:'requestShipping',orderId,sellerId:profile.sellerId});await loadOrders()}catch(e){alert(e.message)}}
async function sendFinal(orderId){const o=currentOrders.find(x=>String(x.id)===String(orderId));if(!o)return;const phone=normalizePhone(o.customerPhone||''),sub=subtotal(o),ship=Number(o.shipping)||0,total=Number(o.total)||sub+ship;if(phone.length<10){alert('El pedido no tiene un WhatsApp válido.');return}const lines=(o.items||[]).map(i=>`• ${i.qty} x ${i.desc} — ${money((Number(i.qty)||0)*(Number(i.price)||0))}`);const text=[`Mate Topp® · ${o.id}`,'*ENVÍO COTIZADO*','',...lines,'',`Productos: ${money(sub)}`,`Envío: ${money(ship)}`,`*TOTAL FINAL: ${money(total)}*`,'','Para pagar, usá únicamente los datos oficiales de Mate Topp® que te indique la persona que gestiona tu pedido.','Después de pagar, enviá el comprobante por este WhatsApp.'].join('\n');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank');try{await qpost({action:'markAwaitingPayment',orderId:o.id,sellerId:profile.sellerId});await loadOrders()}catch(e){alert(e.message)}}
async function uploadReceipt(orderId,input){const file=input.files&&input.files[0];if(!file)return;try{const fd=new FormData();fd.append('orderId',orderId);fd.append('sellerId',profile.sellerId);fd.append('file',file,file.name);const r=await fetch('/receipt-api',{method:'POST',body:fd});const j=await r.json().catch(()=>({ok:false,error:'Respuesta inválida'}));if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');alert('Comprobante cargado. Mate Topp® ya puede revisarlo desde administración.');await loadOrders()}catch(e){alert(e.message)}finally{input.value=''}}
profile=readProfile();if(!profile||!profile.name||!profile.phone){document.getElementById('app').innerHTML='<div class="blocked"><div class="eyebrow">Mate Topp®</div><h2>Primero creá tu acceso.</h2><p class="muted">Volvé al inicio, cargá tu nombre y WhatsApp y después abrí Mis pedidos.</p><button class="primary" onclick="location.href=\'/\'">Ir a crear mi acceso</button></div>'}else{document.getElementById('hello').textContent='Hola, '+profile.name+'.';document.getElementById('clientLink').textContent=clientLink();document.getElementById('copyLink').onclick=()=>navigator.clipboard.writeText(clientLink());document.getElementById('refresh').onclick=loadOrders;loadOrders()}
</script>
</body>
</html>
