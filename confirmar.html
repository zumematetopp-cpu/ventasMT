<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate Topp® | Confirmar pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#173a2b;--cream:#F5EFE5;--gold:#c7a86f;--ink:#34433b;--muted:#707873;--line:#ded6c8}*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:var(--ink);font-family:Poppins,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:30px 18px}.logo{width:145px;margin-bottom:26px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-weight:700;font-size:12px}.title{font-family:"Libre Baskerville",serif;color:var(--green);font-size:40px;font-weight:400;margin:8px 0 20px}.details,.receipt{background:var(--cream);border-radius:18px;padding:18px;margin-top:16px}.items{list-style:none;padding:0;margin:18px 0}.items li{padding:8px 0;border-bottom:1px solid #e6ddcf}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.row.final{font-size:20px;font-weight:700;color:var(--green);border-top:1px solid var(--line);margin-top:8px;padding-top:14px}.receipt img{max-width:100%;max-height:520px;display:block;margin:auto;border-radius:12px}.receipt iframe{width:100%;height:520px;border:0;border-radius:12px;background:#fff}.select{margin-top:20px}.select label{display:block;font-weight:700;color:var(--green);margin-bottom:8px}.select select{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.save{width:100%;margin-top:16px;border:0;background:var(--green);color:#fff;border-radius:14px;padding:16px;font-weight:700;font:inherit}.status{margin-top:14px;color:var(--muted);font-size:13px}.success{background:#e5efe8;color:#174f31;border-radius:14px;padding:14px;font-weight:700;margin-top:16px}.error{background:#f6e9e6;color:#842d23;border-radius:14px;padding:14px}.loading{padding:40px;text-align:center;color:var(--muted)}.link{display:inline-block;margin-top:12px;color:var(--green);font-weight:700;text-decoration:underline}@media(max-width:560px){.title{font-size:32px}.card{padding:20px}.receipt iframe{height:420px}}
</style>
</head>
<body><div class="wrap"><a href="/"><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"></a><div class="card" id="card"><div class="loading">Cargando pedido...</div></div></div>
<script>
const p=new URLSearchParams(location.search),orderId=p.get('pedido')||'',sig=p.get('firma')||'';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseNotes(notes){if(!notes)return{};try{return JSON.parse(notes)}catch{}const m=String(notes).match(/Email:\s*([^\s]+)/i);return{email:m?m[1]:''}}
let order=null;
async function load(){if(!orderId||!sig){document.getElementById('card').innerHTML='<div class="error">El enlace no es válido.</div>';return}try{const r=await fetch('/quote-api?'+new URLSearchParams({action:'adminOrder',orderId,sig}));const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');order=j.order;render()}catch(e){document.getElementById('card').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(){const info=parseNotes(order.notes),items=(order.items||[]).map(i=>`<li>${esc(i.qty)} × ${esc(i.desc)} — ${money((Number(i.qty)||0)*(Number(i.price)||0))}</li>`).join('');const rec=order.receiptUrl?(String(order.receiptType||'').startsWith('image/')?`<img src="${esc(order.receiptUrl)}" alt="Comprobante">`:`<iframe src="${esc(order.receiptUrl)}" title="Comprobante"></iframe>`):'<div class="error">No hay comprobante cargado.</div>';document.getElementById('card').innerHTML=`<div class="eyebrow">Mate Topp®</div><h1 class="title">Confirmar pago</h1><div class="details"><strong>${esc(order.customer)}</strong><br>${esc(order.customerPhone)}${info.email?'<br>'+esc(info.email):''}<br>${esc(order.address)}</div><ul class="items">${items}</ul><div><div class="row"><span>Productos</span><strong>${money(order.subtotal)}</strong></div><div class="row"><span>Envío</span><strong>${money(order.shipping)}</strong></div><div class="row final"><span>Total recibido</span><span>${money(order.total)}</span></div></div><div class="receipt"><strong>Comprobante</strong><div style="margin-top:12px">${rec}</div>${order.receiptUrl?`<a class="link" href="${esc(order.receiptUrl)}" target="_blank">Abrir comprobante</a>`:''}</div><div class="select"><label for="method">Forma de pago</label><select id="method"><option>Transferencia BICA</option><option>Mercado Pago</option><option>Tarjeta de crédito</option></select></div><button class="save" id="confirm">Confirmar pago y generar remito</button><div class="status" id="status">Pedido ${esc(order.id)}</div>`;document.getElementById('confirm').onclick=confirmPayment}
async function confirmPayment(){const btn=document.getElementById('confirm'),status=document.getElementById('status'),paymentMethod=document.getElementById('method').value;btn.disabled=true;btn.textContent='Confirmando...';try{const r=await fetch('/quote-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'confirmPayment',orderId,sig,paymentMethod})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo confirmar');status.className='success';status.innerHTML=`Pago confirmado. Remito generado.<br><a class="link" href="${esc(j.remitoUrl)}" target="_blank">Abrir remito</a>`;btn.textContent='Pago confirmado'}catch(e){status.className='error';status.textContent=e.message;btn.disabled=false;btn.textContent='Confirmar pago y generar remito'}}
load();
</script></body></html>
