<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mate Topp® | Administración completa</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}iframe{width:100%;height:100%;border:0;display:block}.fab{position:fixed;right:18px;bottom:18px;z-index:20;border:0;border-radius:999px;padding:13px 18px;background:#173a2b;color:#fff;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);cursor:pointer}.overlay{position:fixed;inset:0;z-index:30;background:rgba(18,32,25,.55);display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.panel{width:min(980px,100%);max-height:90vh;overflow:auto;background:#f7f4ee;border-radius:24px;padding:22px;color:#34433b}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h2{margin:0;color:#173a2b}.close{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:24px;cursor:pointer}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid #ded6c8;background:#fff;color:#173a2b;border-radius:999px;padding:10px 14px;font-weight:700;cursor:pointer}.tab.active{background:#173a2b;color:#fff}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #ded6c8;border-radius:18px;padding:16px}.card h3{margin:0 0 6px;color:#173a2b}.meta{font-size:12px;color:#707873;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input{width:100%;padding:11px;border:1px solid #ded6c8;border-radius:10px;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#173a2b;color:#fff}.secondary{background:#f3ede2;color:#173a2b}.status{font-size:12px;color:#707873}.expert-grid{display:grid;grid-template-columns:1.2fr 1fr 130px auto;gap:8px;align-items:end}.expert-grid label{font-size:11px;color:#707873}.expert-grid input{width:100%;padding:10px;border:1px solid #ded6c8;border-radius:10px;box-sizing:border-box}@media(max-width:720px){.grid,.expert-grid{grid-template-columns:1fr}.fab{right:12px;bottom:12px}.panel{padding:16px}}</style></head><body><iframe id="base" src="/admin.html" title="Administración Mate Topp®"></iframe><button class="fab" id="open">Logística / Expertos</button><div class="overlay" id="overlay"><section class="panel"><div class="top"><h2>Gestión complementaria</h2><button class="close" id="close">×</button></div><div class="tabs"><button class="tab active" data-tab="log">Logística</button><button class="tab" data-tab="exp">Expertos</button></div><div id="msg" class="status"></div><div id="log" class="list"></div><div id="exp" class="list" style="display:none"></div></section></div><script>const overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),log=document.getElementById('log'),exp=document.getElementById('exp');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));document.getElementById('open').onclick=()=>{overlay.classList.add('open');loadLog()};document.getElementById('close').onclick=()=>overlay.classList.remove('open');overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open')});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const which=b.dataset.tab;log.style.display=which==='log'?'grid':'none';exp.style.display=which==='exp'?'grid':'none';which==='log'?loadLog():loadExperts()});async function get(action){const r=await fetch('/workflow-api?action='+encodeURIComponent(action),{cache:'no-store'}),j=await r.json().catch(()=>({ok:false}));if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');return j}async function post(body){const r=await fetch('/workflow-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({ok:false}));if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo guardar');return j}async function loadLog(){msg.textContent='Cargando...';try{const j=await get('adminTracking');const rows=(j.tracking||[]).filter(x=>x.paymentConfirmedAt||x.dispatchedAt||x.finalizedAt).reverse();msg.textContent=rows.length?'':'Todavía no hay pedidos pagos para despachar.';log.innerHTML=rows.map(t=>{let body='';if(!t.dispatchedAt){body=`<div class="grid"><input id="car-${esc(t.id)}" placeholder="Transportista"><input id="code-${esc(t.id)}" placeholder="Código de seguimiento"><input id="link-${esc(t.id)}" placeholder="https:// seguimiento"></div><div class="actions"><button class="btn primary" onclick="dispatch('${esc(t.id)}')">Marcar despachado</button></div>`}else{body=`<div class="meta">Transportista: ${esc(t.carrier||'—')} · Código: ${esc(t.trackingCode||'—')}<br>Despacho: ${new Date(t.dispatchedAt).toLocaleString('es-AR')}</div><div class="actions">${t.publicTrackingUrl?`<button class="btn secondary" onclick="window.open('${esc(t.publicTrackingUrl)}','_blank')">Abrir seguimiento</button>`:''}${!t.finalizedAt?`<button class="btn primary" onclick="finish('${esc(t.id)}')">Finalizar pedido</button>`:'<strong>Pedido finalizado</strong>'}</div>`}return `<article class="card"><h3>${esc(t.id)}</h3><div class="meta">${esc(t.customer||'Cliente')} · ${esc(t.status||'')}</div>${body}</article>`}).join('')}catch(e){msg.textContent=e.message==='No autorizado'?'Iniciá sesión en Administración y volvé a abrir este módulo.':e.message;log.innerHTML=''}}async function dispatch(id){const carrier=document.getElementById('car-'+id).value.trim(),trackingCode=document.getElementById('code-'+id).value.trim(),trackingLink=document.getElementById('link-'+id).value.trim();try{await post({action:'dispatchOrder',orderId:id,carrier,trackingCode,trackingLink});await loadLog()}catch(e){alert(e.message)}}async function finish(id){if(!confirm('¿Marcar este pedido como finalizado?'))return;try{await post({action:'finalizeOrder',orderId:id});await loadLog()}catch(e){alert(e.message)}}async function loadExperts(){msg.textContent='Cargando Expertos...';try{const j=await get('experts');const rows=j.experts||[];msg.textContent=rows.length?'':'No hay Expertos creados.';exp.innerHTML=rows.map(e=>`<article class="card"><div class="expert-grid"><div><label>Experto</label><div><strong>${esc(e.firstName)} ${esc(e.lastName)}</strong><br><span class="status">${esc(e.slug)} · ${esc(e.phone)}</span></div></div><div><label>Zona</label><input id="zone-${esc(e.phone)}" value="${esc(e.zone||'Argentina')}"></div><div><label>Prioridad</label><input id="prio-${esc(e.phone)}" type="number" value="${Number(e.publicPriority)||0}"></div><button class="btn primary" onclick="saveExpert('${esc(e.phone)}')">Guardar</button></div></article>`).join('')}catch(e){msg.textContent=e.message==='No autorizado'?'Iniciá sesión en Administración y volvé a abrir este módulo.':e.message;exp.innerHTML=''}}async function saveExpert(phone){try{await post({action:'updateExpert',phone,zone:document.getElementById('zone-'+phone).value,publicPriority:Number(document.getElementById('prio-'+phone).value)||0});await loadExperts()}catch(e){alert(e.message)}}</script></body></html>
