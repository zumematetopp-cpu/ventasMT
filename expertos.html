<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprar | Expertos Mate Topp®</title><link rel="stylesheet" href="/site-public.css"><style>.choose{padding:72px 0 90px;background:#f5efe5;min-height:70vh}.choose h1{margin:0 0 14px;color:var(--green);font-family:'Libre Baskerville',serif;font-size:clamp(44px,5vw,70px);font-weight:400}.choose p{max-width:760px;font-size:18px;line-height:1.6}.zonebar{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.zonebar button{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:999px;padding:11px 16px;font-weight:600;cursor:pointer}.zonebar button.active{background:var(--green);color:#fff}.experts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.expert-card{background:#fff;border:1px solid #e2dacd;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-family:'Libre Baskerville',serif;font-size:28px}.expert-card h2{margin:0;color:var(--green);font-family:'Libre Baskerville',serif;font-size:28px;font-weight:400}.zone{font-size:12px;color:var(--muted)}.new{display:inline-flex;width:max-content;background:#f1e4c9;color:var(--green);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700}.expert-card .btn{margin-top:auto}.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}@media(max-width:900px){.experts-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.experts-grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap head"><a href="/"><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"></a><nav class="nav"><a href="/#catalogo">Blends</a><a href="/mate-topp">Mate Topp®</a><a href="/comprar">Comprar</a><a class="portal" href="/portal">Portal de Expertos</a></nav></div></header><main class="choose"><div class="wrap"><p class="eyebrow">Comprar Mate Topp®</p><h1>Elegí a tu Experto Mate Topp®</h1><p>Comprale al Experto que prefieras. El orden se renueva para dar visibilidad a distintos Expertos y priorizar incorporaciones nuevas.</p><div class="zonebar" id="zones"></div><div class="experts-grid" id="experts"><div class="empty">Cargando Expertos...</div></div></div></main><script>const q=new URLSearchParams(location.search);if(q.get('experto'))location.replace('/catalogo?'+q.toString());let all=[];let active='Todos';const grid=document.getElementById('experts'),zones=document.getElementById('zones');function initials(n){return String(n||'MT').trim().slice(0,1).toUpperCase()}function render(){const data=active==='Todos'?all:all.filter(e=>(e.zone||'Argentina')===active);grid.innerHTML=data.length?data.map(e=>`<article class="expert-card"><div class="avatar">${initials(e.firstName)}</div>${e.isNew?'<span class="new">NUEVO EXPERTO</span>':''}<h2>${e.firstName}</h2><div class="zone">${e.zone||'Argentina'}</div><a class="btn btn-main" href="/catalogo?experto=${encodeURIComponent(e.slug)}">Comprar con ${e.firstName}</a></article>`).join(''):'<div class="empty">Todavía no hay Expertos disponibles en esta zona.</div>'}function renderZones(){const zs=['Todos',...new Set(all.map(e=>e.zone||'Argentina'))];zones.innerHTML=zs.map(z=>`<button class="${z===active?'active':''}" data-zone="${z}">${z}</button>`).join('');zones.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.zone;renderZones();render()})}(async()=>{try{const r=await fetch('/experts-api',{cache:'no-store'}),j=await r.json();all=j.ok?j.experts||[]:[];renderZones();render()}catch{grid.innerHTML='<div class="empty">No se pudo cargar el listado de Expertos.</div>'}})();</script></body></html>
