<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mate Topp® | Cotizar envío</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#173a2b;--cream:#F5EFE5;--gold:#c7a86f;--ink:#34433b;--muted:#707873;--line:#ded6c8}*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:var(--ink);font-family:Poppins,Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:32px 18px}.logo{width:145px;margin-bottom:28px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-weight:700;font-size:12px}.title{font-family:"Libre Baskerville",serif;color:var(--green);font-size:40px;font-weight:400;margin:8px 0 20px}.details{background:var(--cream);border-radius:18px;padding:18px;line-height:1.65}.items{list-style:none;padding:0;margin:18px 0}.items li{padding:8px 0;border-bottom:1px solid #e6ddcf}.totals{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.row.final{font-size:20px;font-weight:700;color:var(--green);border-top:1px solid var(--line);margin-top:8px;padding-top:14px}.field{margin-top:22px}.field label{display:block;color:var(--green);font-weight:700;margin-bottom:8px}.field input{width:100%;font:inherit;font-size:20px;padding:15px;border:1px solid var(--line);border-radius:14px}.save{width:100%;margin-top:16px;border:0;background:var(--green);color:#fff;border-radius:14px;padding:16px;font-weight:700;font:inherit}.status{margin-top:14px;color:var(--muted);font-size:13px}.success{background:#e5efe8;color:#174f31;border-radius:14px;padding:14px;font-weight:700;margin-top:16px}.error{background:#f6e9e6;color:#842d23;border-radius:14px;padding:14px}.loading{padding:40px;text-align:center;color:var(--muted)}@media(max-width:560px){.title{font-size:32px}.card{padding:20px}}
</style>
</head>
<body><div class="wrap"><a href="/"><img class="logo" src="https://mate-topp-ventas.zumematetopp.chatgpt.site/mate-topp-logo.png" alt="Mate Topp®"></a><div class="card" id="card"><div class="loading">Cargando pedido...</div></div></div>
<script>
const p=new URLSearchParams(location.search),orderId=p.get('pedido')||'',sig=p.get('firma')||'';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n)||0);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function parseNotes(notes){if(!notes)return{};try{return JSON.parse(notes)}catch{}const m=String(notes).match(/Email:\s*([^\s]+)/i);return{email:m?m[1]:''}}
let order=null;
async function load(){if(!orderId||!sig){document.getElementById('card').innerHTML='<div class="error">El enlace de cotización no es válido.</div>';return}try{const r=await fetch('/quote-api?'+new URLSearchParams({action:'order',orderId,sig}));const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');order=j.order;render()}catch(e){document.getElementById('card').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(){const info=parseNotes(order.notes),items=(order.items||[]).map(i=>`<li>${esc(i.qty)} × ${esc(i.desc)} — ${money((Number(i.qty)||0)*(Number(i.price)||0))}</li>`).join('');document.getElementById('card').innerHTML=`<div class="eyebrow">Mate Topp®</div><h1 class="title">Cotizar envío</h1><div class="details"><strong>${esc(order.customer)}</strong><br>${esc(order.customerPhone)}${info.email?'<br>'+esc(info.email):''}<br>${esc(order.address)}</div><ul class="items">${items}</ul><div class="totals"><div class="row"><span>Productos</span><strong>${money(order.subtotal)}</strong></div><div class="row"><span>Envío</span><strong id="shipView">${order.shipping?money(order.shipping):'A cotizar'}</strong></div><div class="row final"><span>Total final</span><span id="totalView">${money(order.total)}</span></div></div><div class="field"><label for="shipping">Costo del envío</label><input id="shipping" inputmode="numeric" placeholder="$ 0" value="${order.shipping||''}"></div><button class="save" id="save">Guardar cotización</button><div class="status" id="status">Pedido ${esc(order.id)}</div>`;document.getElementById('save').onclick=save}
async function save(){const btn=document.getElementById('save'),status=document.getElementById('status'),shipping=Number(String(document.getElementById('shipping').value).replace(/[^0-9.,]/g,'').replace(',','.'));if(!Number.isFinite(shipping)||shipping<0){alert('Ingresá un costo de envío válido.');return}btn.disabled=true;btn.textContent='Guardando...';try{const r=await fetch('/quote-api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'quoteShipping',orderId,sig,shipping})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo guardar');order=j.order;document.getElementById('shipView').textContent=money(order.shipping);document.getElementById('totalView').textContent=money(order.total);status.className='success';status.textContent='Envío cotizado. Ya aparece en el panel de la persona que recibió el pedido.';btn.textContent='Cotización guardada'}catch(e){status.className='error';status.textContent=e.message;btn.disabled=false;btn.textContent='Guardar cotización'}}
load();
</script></body></html>
