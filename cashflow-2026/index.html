<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Cash Flow 2026</title></head><body><script>
(async()=>{try{const files=['app-01.part','app-02.part','app-03.part','app-04.part','app-05.part','app-06.part','app-07.part','app-08.part','app-09.part'];let s='';for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f);s+=await r.text();}
const boton='<button class="b" onclick="backup()">Copia</button>';s=s.replace(boton,boton+'\n  <button class="b" onclick="descargarCarpeta()">Carpeta</button>');
const fn=`\nasync function descargarCarpeta(){\n  if(!window.showDirectoryPicker){toast('Usá Chrome para elegir carpeta');return;}\n  try{\n    const dir=await window.showDirectoryPicker({mode:'readwrite'});\n    const escribir=async(n,t,c)=>{const h=await dir.getFileHandle(n,{create:true});const w=await h.createWritable();await w.write(new Blob([c],{type:t}));await w.close();};\n    const L=[];\n    L.push('CASH FLOW 2026 - descargado por '+(USER||'?')+' el '+ahora());L.push('');\n    L.push(['Categoria','Item','Ultimos4','Vence','Link'].concat(M.flatMap(m=>[m+' monto',m+' pagado',m+' quien'])).join(';'));\n    D.items.forEach(i=>L.push([i.cat,i.nombre,i.last4,i.venc,i.link].concat(i.m.flatMap(c=>[c.v,c.p?'SI':'NO',c.q||''])).join(';')));\n    L.push('');L.push('INGRESOS');L.push('Fecha;Concepto;USD;Tasa;ARS;Entidad;Cargado por;Cuando');D.ing.forEach(r=>L.push([r.fecha,r.concepto,r.usd,r.tasa,r.ars,r.cuenta,r.q||'',r.c||''].join(';')));\n    L.push('');L.push('GASTOS DIARIOS');L.push('Fecha;Lugar;Monto;Cargado por;Cuando');D.dia.forEach(r=>L.push([r.fecha,r.lugar,r.monto,r.q||'',r.c||''].join(';')));\n    L.push('');L.push('TICKETS - DETALLE');L.push('Fecha;Lugar;Producto;Rubro;Cantidad;Importe;Total ticket;Cargado por');D.tk.forEach(t=>t.items.forEach(r=>L.push([t.fecha,t.lugar,r.n,r.r,r.c||1,r.p,t.total,t.q||''].join(';'))));\n    const f=new Date().toISOString().slice(0,10);\n    await escribir('cashflow-2026.csv','text/csv;charset=utf-8','\\ufeff'+L.join('\\n'));\n    await escribir('cashflow-'+f+'.json','application/json;charset=utf-8',JSON.stringify(D,null,2));\n    localStorage.setItem('cf_ultima_copia',String(Date.now()));avisoCopia();toast('CSV + copia guardados en la carpeta');\n  }catch(e){if(e&&e.name!=='AbortError')toast('No se pudo guardar en la carpeta');}\n}\n`;s=s.replace('</script>\n</body>',fn+'</script>\n</body>');document.open();document.write(s);document.close();}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">No se pudo cargar Cash Flow.</p>';}})();
</script></body></html>
